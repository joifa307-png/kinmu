<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>出勤簿</title>
<script charset="utf-8" src="https://static.worksmobile.net/static/wm/woff/edge/3.7.1/sdk.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:24px;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:#eae5e3;color:#37322f;min-height:100vh;line-height:1.5}
.app{max-width:480px;margin:0 auto;padding:12px 14px 32px}
.card{background:#FCFBFA;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(55,50,47,.06)}
.name-card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(55,50,47,.08)}
.name-card-head{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-bottom:4px}
.name-card-head-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
#guideBtn{width:32px;height:32px;border-radius:50%;background:#0f6e56;color:#fff;font-size:15px;font-weight:700;border:none;cursor:pointer;flex-shrink:0;font-family:inherit;line-height:1;padding:0}
.app-version{font-size:.52rem;color:#d0cbc7;font-weight:400;flex-shrink:0;text-align:right;line-height:1}
.name-card .staff-name{font-size:1.1rem;font-weight:700;margin-bottom:0;flex:1;min-width:0}
.name-card .staff-meta{font-size:.85rem;color:#6b6562;margin-bottom:12px}
.date-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:10px;border-top:1px solid #ece8e5}
.date-nav button{background:none;border:none;font-size:1.4rem;color:#0f6e56;padding:4px 12px;cursor:pointer;line-height:1}
.date-nav button:disabled{opacity:.3;cursor:default}
.date-nav .date-label{font-size:.95rem;font-weight:600;flex:1;text-align:center;background:none;border:none;color:#37322f;font-family:inherit;cursor:pointer;padding:4px 8px;border-radius:8px}
.date-nav .date-label:active{background:#f5f3f1}
.section-label{font-size:.8rem;font-weight:600;color:#6b6562;margin-bottom:8px;letter-spacing:.02em}
.shift-toggles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shift-toggle{border:2px solid #d8d2ce;border-radius:10px;padding:12px 8px;text-align:center;font-size:.9rem;font-weight:600;background:#fff;color:#37322f;cursor:pointer;transition:all .15s}
.shift-toggle.active{border-color:#0f6e56;background:#dcefe2;color:#0f6e56}
.dial-wrap{margin-top:4px}
.dial-wrap.dials-hidden .dial-wheels{display:none}
.dial-wrap.dials-locked .dial-row,.dial-wrap.dials-locked .dial-col,.dial-wrap.dials-locked .wheel-outer{touch-action:pan-y}
.dial-wrap.dials-locked .wheel-outer{opacity:.55}
.dial-wrap.dials-locked .wheel{overflow:hidden;pointer-events:none;touch-action:pan-y}
.dial-wrap.dials-editing .dial-wheels{border:2px solid #0f6e56;border-radius:12px;padding:8px 4px 4px;background:#f8fcf9;margin-top:8px}
.dial-header{display:flex;align-items:center;gap:8px;margin-top:10px}
.dial-header .range{flex:1;font-size:.9rem;font-weight:600;min-width:0}
.btn-dial-edit{flex:0 0 auto;min-width:4.2em;border:2px solid #d8d2ce;border-radius:10px;padding:12px 8px;text-align:center;font-size:.9rem;font-weight:600;background:#fff;color:#ce5242;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-dial-edit.editing{border-color:#ce5242;background:#ce5242;color:#fff}
.btn-dial-edit:disabled{opacity:.4;cursor:default}
.dial-wheels{margin-top:0}
.overtime-reason-panel,.late-reason-panel{margin-top:8px;padding-top:8px;border-top:1px solid #ece8e5}
.overtime-reason-panel .section-label,.late-reason-panel .section-label{margin-bottom:8px}
.hol-row{margin-top:10px}
.dial-row{display:flex;align-items:center;justify-content:center;gap:4px}
.dial-col{flex:1;max-width:72px}
.dial-label{text-align:center;font-size:.7rem;color:#6b6562;margin-bottom:4px}
.wheel-outer{position:relative;height:210px;overflow:hidden;border-radius:10px;background:#fff;border:1px solid #e8e4e1}
.wheel-outer::before,.wheel-outer::after{content:"";position:absolute;left:0;right:0;height:60px;z-index:2;pointer-events:none}
.wheel-outer::before{top:0;background:linear-gradient(to bottom,#fff 30%,rgba(255,255,255,0))}
.wheel-outer::after{bottom:0;background:linear-gradient(to top,#fff 30%,rgba(255,255,255,0))}
.wheel-highlight{position:absolute;top:50%;left:2px;right:2px;height:66px;margin-top:-33px;background:#dcefe2;border:1px solid rgba(15,110,86,.25);border-radius:8px;z-index:0;pointer-events:none}
.wheel{position:relative;z-index:1;height:100%;overflow-y:scroll;scrollbar-width:none;background:transparent;touch-action:none;overscroll-behavior:contain}
.wheel::-webkit-scrollbar{display:none}
.wheel-item{height:66px;display:flex;align-items:center;justify-content:center;font-size:1.15rem;font-weight:600;color:#b5aea8;flex-shrink:0;line-height:66px;-webkit-tap-highlight-color:transparent;user-select:none}
.wheel-item.sel{color:#0f6e56;font-size:1.35rem;font-weight:700}
.wheel-item.wheel-pad{visibility:hidden;pointer-events:none}
.dial-sep{font-size:1.2rem;font-weight:700;padding-top:27px;color:#6b6562}
.banner{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:12px;margin-bottom:12px;font-weight:600}
.banner.work{background:#dcefe2;color:#0f6e56}
.banner.holiday{background:#faeeda;color:#854f0b}
.banner.paid{background:#e6f1fb;color:#185fa5}
.banner.paid-pending{background:#faeeda;color:#854f0b}
.banner.abs{background:#fcebeb;color:#a32d2d}
.banner .banner-main{font-size:1.05rem}
.banner .banner-sub{font-size:.85rem;opacity:.85}
.chip-row{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid #d8d2ce;border-radius:20px;padding:8px 16px;font-size:.85rem;font-weight:600;background:#fff;cursor:pointer;transition:all .15s}
.chip.active.late{border-color:#0f6e56;background:#dcefe2;color:#0f6e56}
.chip.active.hol{border-color:#854f0b;background:#faeeda;color:#854f0b}
.chip.active.sick,.chip.active.other{border-color:#a32d2d;background:#fcebeb;color:#a32d2d}
.chip.active.ot{border-color:#0f6e56;background:#dcefe2;color:#0f6e56}
.seg-row{display:flex;border-radius:10px;overflow:hidden;border:2px solid #d8d2ce}
.seg{flex:1;padding:11px 4px;text-align:center;font-size:.82rem;font-weight:600;background:#fff;cursor:pointer;border:none;color:#37322f;transition:all .15s}
.seg+.seg{border-left:2px solid #d8d2ce}
.seg.active.work{background:#dcefe2;color:#0f6e56}
.seg.active.paid{background:#e6f1fb;color:#185fa5}
.seg.active.abs{background:#fcebeb;color:#a32d2d}
.dimmed{opacity:.45;pointer-events:none;user-select:none}
textarea{width:100%;border:1px solid #d8d2ce;border-radius:10px;padding:12px;font-size:.9rem;font-family:inherit;resize:vertical;min-height:72px;background:#fff;color:#37322f}
textarea:focus{outline:2px solid #0f6e56;outline-offset:0}
input[type=text]{width:100%;border:1px solid #d8d2ce;border-radius:10px;padding:10px 12px;font-size:.9rem;font-family:inherit;background:#fff;color:#37322f;margin-top:8px}
input[type=text]:focus{outline:2px solid #0f6e56;outline-offset:0}
.reason-block{margin-top:10px}
.warn{color:#a32d2d;font-size:21px;text-align:center;margin:12px 0 8px;min-height:20px;white-space:pre-line;line-height:1.55}
.btn-submit{width:100%;padding:16px;border:none;border-radius:12px;background:#2a2522;color:#fff;font-size:1rem;font-weight:700;cursor:pointer;transition:opacity .15s}
.btn-submit:disabled{opacity:.4;cursor:default}
.btn-withdraw{width:100%;padding:12px;border:2px solid #854f0b;border-radius:12px;background:#fff;color:#854f0b;font-size:.9rem;font-weight:700;cursor:pointer;margin-top:8px;font-family:inherit;transition:opacity .15s}
.btn-withdraw:disabled{opacity:.4;cursor:default}
.approval-label{font-size:.78rem;font-weight:700;margin-top:10px;padding:6px 12px;border-radius:8px;display:inline-block}
.approval-label.pending{background:#faeeda;color:#854f0b}
.approval-label.approved{background:#e6f1fb;color:#185fa5}
.not-reg{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;padding:24px 16px}
.not-reg-card{background:#fff;border-radius:14px;padding:24px 20px;max-width:400px;width:100%;box-shadow:0 1px 3px rgba(55,50,47,.08);text-align:center}
.not-reg-msg{font-size:.95rem;color:#37322f;line-height:1.75;margin-bottom:20px}
.not-reg-id-label{font-size:.85rem;color:#6b6562;margin-bottom:8px;text-align:left}
.not-reg-id{width:100%;font-size:1.15rem;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:14px 12px;border:2px solid #d8d2ce;border-radius:10px;background:#FCFBFA;color:#0f6e56;text-align:center;-webkit-user-select:all;user-select:all;cursor:text}
.not-reg-id:focus{outline:2px solid #0f6e56;outline-offset:0}
.not-reg-name{font-size:1.05rem;font-weight:700;color:#37322f;text-align:left;margin-bottom:14px}
.not-reg-send{width:100%;margin-top:16px;padding:16px;border:none;border-radius:12px;background:#0f6e56;color:#fff;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
.not-reg-send:active{opacity:.85}
.not-reg-copy{width:100%;margin-top:10px;padding:13px;border:2px solid #d8d2ce;border-radius:10px;background:#fff;color:#37322f;font-size:.95rem;font-weight:600;cursor:pointer;font-family:inherit}
.not-reg-status{font-size:.85rem;line-height:1.6;margin-top:14px;min-height:1.4em;text-align:center;color:#0f6e56}
.not-reg-status.err{color:#ce5242}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2a2522;color:#fff;padding:10px 20px;border-radius:20px;font-size:.85rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:100;white-space:pre-line;text-align:center;max-width:calc(100vw - 32px)}
.toast.toast-farewell{top:50%;bottom:auto;transform:translate(-50%,-50%);background:#faeeda;color:#854f0b;min-width:17em;padding:16px 36px;font-size:.92rem;line-height:1.65;word-break:keep-all}
.toast.show{opacity:1}
.cal-overlay{position:fixed;inset:0;background:rgba(55,50,47,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.cal-modal{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:340px;box-shadow:0 4px 20px rgba(55,50,47,.15)}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-header button{background:none;border:none;font-size:1.4rem;color:#0f6e56;padding:4px 12px;cursor:pointer;line-height:1}
.cal-header button:disabled{opacity:.3;cursor:default}
.cal-title{font-size:.95rem;font-weight:700;flex:1;text-align:center}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.cal-weekdays span{text-align:center;font-size:.65rem;color:#6b6562;font-weight:600;padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-day{aspect-ratio:1;border:none;border-radius:8px;background:#fff;font-size:.85rem;font-weight:600;color:#37322f;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;padding:0}
.cal-day.cal-empty{background:transparent;pointer-events:none}
.cal-day.today{box-shadow:inset 0 0 0 2px #0f6e56}
.cal-day.selected{background:#dcefe2;color:#0f6e56}
.cal-day:disabled,.cal-day.disabled{color:#d8d2ce;cursor:default}
.cal-close{width:100%;margin-top:12px;padding:10px;border:2px solid #d8d2ce;border-radius:10px;background:#fff;font-size:.85rem;font-weight:600;color:#37322f;cursor:pointer;font-family:inherit}
.btn-history-row{display:flex;justify-content:center;margin-top:12px}
.history-view{position:fixed;inset:0;background:#eae5e3;z-index:150;overflow-y:auto;-webkit-overflow-scrolling:touch}
.history-inner{max-width:480px;margin:0 auto;padding:12px 14px 32px}
.hist-back{background:none;border:none;color:#0f6e56;font-size:.85rem;font-weight:600;padding:4px 0;cursor:pointer;font-family:inherit;margin-bottom:8px}
.hist-title{font-size:1.1rem;font-weight:700;margin-bottom:12px}
.hist-period-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.hist-period-nav button{background:none;border:none;font-size:1.4rem;color:#0f6e56;padding:4px 12px;cursor:pointer;line-height:1}
.hist-period-nav button:disabled{opacity:.3;cursor:default}
.hist-period-label{flex:1;text-align:center;font-size:.9rem;font-weight:600;line-height:1.4}
.hist-summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.hist-sum-item{background:#fff;border-radius:10px;padding:10px 8px;text-align:center}
.hist-sum-item .val{font-size:.95rem;font-weight:700;color:#0f6e56}
.hist-sum-item .lbl{font-size:.65rem;color:#6b6562;margin-top:2px}
.hist-status{text-align:center;padding:20px;color:#6b6562;font-size:.85rem}
.hist-status.error{color:#a32d2d}
.hist-retry{margin-top:10px;padding:8px 20px;border:2px solid #d8d2ce;border-radius:20px;background:#fff;font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit}
.hist-list{display:flex;flex-direction:column;gap:6px}
.hist-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:10px 12px;border-radius:10px;font-size:.8rem;font-weight:600}
.hist-row .hist-date{flex:0 0 auto;white-space:nowrap}
.hist-row .hist-shift{flex:0 0 auto}
.hist-row .hist-work{flex:0 0 auto}
.hist-row .hist-ot{flex:0 0 auto;min-width:2.5em}
.hist-row .hist-label-only{flex:1;font-weight:600}
.hist-row .hist-tag{flex:0 0 auto;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.45)}
.hist-row.st-work{background:#dcefe2;color:#0f6e56}
.hist-row.st-hol{background:#faeeda;color:#854f0b}
.hist-row.st-paid{background:#e6f1fb;color:#185fa5}
.hist-row.st-paid-pending{background:#faeeda;color:#854f0b}
.hist-row.st-abs{background:#fcebeb;color:#a32d2d}
.hist-tag-pending{flex:0 0 auto;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.5);color:#854f0b}
</style>
</head>
<body>
<div id="app" class="app" style="display:none">
  <div class="name-card">
    <div class="name-card-head">
      <div class="staff-name" id="staffName"></div>
      <div class="name-card-head-right">
        <span class="app-version" id="appVersion"></span>
        <button type="button" id="guideBtn" onclick="openGuide()" aria-label="使い方ガイド">？</button>
      </div>
    </div>
    <div class="staff-meta" id="staffMeta"></div>
    <div class="date-nav">
      <button type="button" id="btnPrev" aria-label="前日">&#8249;</button>
      <button type="button" class="date-label" id="dateLabel" aria-label="日付を選択"></button>
      <button type="button" id="btnNext" aria-label="翌日">&#8250;</button>
    </div>
  </div>

  <div class="card" id="workArea">
    <div class="section-label">シフト</div>
    <div class="shift-toggles" id="shiftToggles"></div>
    <div class="chip-row hol-row">
      <button type="button" class="chip" id="chipHol" data-key="hol">休日出勤</button>
    </div>

    <div class="dial-wrap dials-locked dials-hidden" id="dialWrap">
      <div class="dial-header">
        <span class="range" id="dialRange"></span>
        <button type="button" id="btnDialEdit" class="btn-dial-edit">変更</button>
      </div>
      <div class="dial-wheels" id="dialWheels">
      <div class="dial-row">
        <div class="dial-col">
          <div class="dial-label">開始 時</div>
          <div class="wheel-outer"><div class="wheel-highlight"></div><div class="wheel" id="whStart"></div></div>
        </div>
        <div class="dial-col">
          <div class="dial-label">開始 分</div>
          <div class="wheel-outer"><div class="wheel-highlight"></div><div class="wheel" id="wmStart"></div></div>
        </div>
        <div class="dial-sep">〜</div>
        <div class="dial-col">
          <div class="dial-label">終了 時</div>
          <div class="wheel-outer"><div class="wheel-highlight"></div><div class="wheel" id="whEnd"></div></div>
        </div>
        <div class="dial-col">
          <div class="dial-label">終了 分</div>
          <div class="wheel-outer"><div class="wheel-highlight"></div><div class="wheel" id="wmEnd"></div></div>
        </div>
        </div>
      </div>
      <div id="lateReasonPanel" class="late-reason-panel" style="display:none">
        <div class="section-label">遅刻・早退（所定より短い・必須）</div>
        <div class="chip-row" id="lateKindRow">
          <button type="button" class="chip" data-kind="late">遅刻</button>
          <button type="button" class="chip" data-kind="early">早退</button>
        </div>
        <div class="reason-block" id="lateNoteBlock">
          <input type="text" id="lateNote" placeholder="理由（必須）" maxlength="200">
        </div>
      </div>
      <div id="overtimeReasonPanel" class="overtime-reason-panel" style="display:none">
        <div class="section-label">残業理由（1時間以上・必須）</div>
        <div class="chip-row" id="overtimeReasonRow">
          <button type="button" class="chip" data-reason="care">利用者対応</button>
          <button type="button" class="chip" data-reason="records">記録・書類作成</button>
          <button type="button" class="chip" data-reason="meeting">会議・研修</button>
          <button type="button" class="chip" data-reason="shortage">人員不足・業務集中</button>
          <button type="button" class="chip" data-reason="other">その他</button>
        </div>
        <div class="reason-block" id="overtimeNoteBlock" style="display:none">
          <input type="text" id="overtimeNote" placeholder="残業理由（その他の場合は必須）" maxlength="200">
        </div>
      </div>
    </div>
  </div>

  <div class="banner work" id="banner">
    <span class="banner-main" id="bannerMain">実働 0.0H</span>
    <span class="banner-sub" id="bannerSub">残業 0.0H</span>
  </div>

  <div class="card">
    <div class="section-label">区分</div>
    <div class="seg-row" id="segRow">
      <button type="button" class="seg active work" data-mode="work">通常勤務</button>
      <button type="button" class="seg" data-mode="paid_leave">有給</button>
      <button type="button" class="seg" data-mode="absence">欠勤</button>
    </div>
    <div class="reason-block" id="absReasonBlock" style="display:none;margin-top:12px">
      <div class="chip-row">
        <button type="button" class="chip" id="chipSick" data-reason="sick">病欠</button>
        <button type="button" class="chip" id="chipOther" data-reason="other">その他</button>
      </div>
      <input type="text" id="absenceNote" placeholder="欠勤理由（その他の場合は必須）" maxlength="200" style="display:none">
    </div>
    <div id="approvalLabel" class="approval-label" style="display:none" aria-live="polite"></div>
  </div>

  <div class="card">
    <div class="section-label">特記事項</div>
    <textarea id="memo" placeholder="自由記入" maxlength="500"></textarea>
  </div>

  <div class="warn" id="warnMsg"></div>
  <button type="button" class="btn-submit" id="btnSubmit">登録する</button>
  <button type="button" class="btn-withdraw" id="btnWithdraw" style="display:none">申請を取り下げる</button>
  <div class="btn-history-row">
    <button type="button" class="chip" id="btnHistory">履歴</button>
  </div>
</div>

<div id="historyView" class="history-view" style="display:none" aria-hidden="true">
  <div class="history-inner">
    <button type="button" class="hist-back" id="histBack">← 入力に戻る</button>
    <div class="hist-title">勤務履歴</div>
    <div class="card">
      <div class="hist-period-nav">
        <button type="button" id="histPrevPeriod" aria-label="前月度">&#8249;</button>
        <div class="hist-period-label" id="histPeriodLabel"></div>
        <button type="button" id="histNextPeriod" aria-label="翌月度">&#8250;</button>
      </div>
      <div id="histSummary" class="hist-summary" style="display:none"></div>
      <div id="histStatus" class="hist-status">読み込み中…</div>
      <div id="histList" class="hist-list"></div>
    </div>
  </div>
</div>

<div id="notReg" class="not-reg" style="display:none">
  <div class="not-reg-card">
    <p class="not-reg-msg">まだ登録されていません。<br>下の「本部にIDを送る」を押して、<b>本部との個別トーク</b>に送ってください。</p>
    <p class="not-reg-id-label">氏名：</p>
    <div id="notRegName" class="not-reg-name">—</div>
    <p class="not-reg-id-label">あなたのID：</p>
    <input type="text" id="notRegId" class="not-reg-id" readonly>
    <button type="button" class="not-reg-send" id="notRegSend">本部にIDを送る</button>

function spanMin(start, end) {
  let s = end - start;
  if (s <= 0) s += 1440;
  return s;
}
function computeWorkMin(start, end, breakMin) {
  return spanMin(start, end) - breakMin;
}
function computeActualWork(start, end, breakMin) {
  return spanMin(start, end) - breakMin;
}
function computeOvertime(actualWorkMin, shiftWorkMin) {

/* ── 締め期間（月度） ── */
function getPeriod(baseDate) {
  const d = baseDate || todayStr();
  const [y, m, day] = d.split('-').map(Number);
  let periodYear, periodMonth;
  if (day >= 11) {
    periodYear = y;
    periodMonth = m;
  } else {
    const prev = new Date(y, m - 2, 1);
    periodYear = prev.getFullYear();
    periodMonth = prev.getMonth() + 1;
  }
  const from = `${periodYear}-${String(periodMonth).padStart(2, '0')}-11`;
  const endDt = new Date(periodYear, periodMonth, 10);
  const to = `${endDt.getFullYear()}-${String(endDt.getMonth() + 1).padStart(2, '0')}-${String(endDt.getDate()).padStart(2, '0')}`;
  const tm = endDt.getMonth() + 1;
  const td = endDt.getDate();
  return {
    label: `${periodMonth}月度`,
    from,
    to,
    periodYear,
    periodMonth,
    rangeLabel: `${periodMonth}/11〜${tm}/${td}`
  };
}

function getPeriodByOffset(offset) {
  const cur = getPeriod(todayStr());
  const dt = new Date(cur.periodYear, cur.periodMonth - 1 - offset, 15);
  const base = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-15`;
  return getPeriod(base);
}

function isEmpty(v) {
  if (v === null || v === undefined) return true;
  if (typeof v === 'string' && v.trim() === '') return true;
  if (Array.isArray(v) && v.length === 0) return true;
  if (typeof v === 'object' && !Array.isArray(v) && Object.keys(v).length === 0) return true;
  return false;
}

function todayStr() {

  const y = d.getFullYear();

  const out = JSON.parse(JSON.stringify(base));
  Object.keys(incoming).forEach(k => {

    if (!isEmpty(v)) out[k] = v;
  });
  return out;
}

function mergeDb(local, remote) {
  const result = { records: {} };
  const keys = new Set([
    ...Object.keys((local && local.records) || {}),
    ...Object.keys((remote && remote.records) || {})
  ]);
  keys.forEach(k => {
    result.records[k] = mergeRecord(
      local && local.records && local.records[k],
      remote && remote.records && remote.records[k]
    );
  });
  return result;
}

/* ── ホイール ── */
const WHEEL_ITEM_H = 66;
const WHEEL_DRAG_RATIO = 0.28;

function fillWheel(el, vals, cur, cb) {
  el.innerHTML = '';
  const topPad = document.createElement('div');
  topPad.className = 'wheel-item wheel-pad';
  topPad.textContent = '00';
  el.appendChild(topPad);
  vals.forEach(v => {
    const item = document.createElement('div');
    item.className = 'wheel-item';
    item.dataset.val = v;
    item.textContent = String(v).padStart(2, '0');
    el.appendChild(item);
  });
  const bottomPad = topPad.cloneNode(true);
  el.appendChild(bottomPad);

  let programmatic = false;
  let lastEmitted = Number(cur);
  let dragLastY = 0;
  let dragging = false;

  function indexForVal(val) {
    const idx = vals.indexOf(Number(val));
    return idx >= 0 ? idx : 0;
  }

  function scrollTopForIndex(idx) {
    return Math.max(0, (idx + 1) * WHEEL_ITEM_H - (el.clientHeight - WHEEL_ITEM_H) / 2);
  }

  function maxScrollTop() {
    return scrollTopForIndex(vals.length - 1);
  }

  function indexAtCenter() {
    const center = el.scrollTop + el.clientHeight / 2;
    const idx = Math.round((center - WHEEL_ITEM_H / 2) / WHEEL_ITEM_H) - 1;
    return Math.max(0, Math.min(vals.length - 1, idx));
  }

  function updateHighlight() {
    const idx = indexAtCenter();
    el.querySelectorAll('.wheel-item[data-val]').forEach((item, i) => {
      item.classList.toggle('sel', i === idx);
    });
    return vals[idx];
  }

  function emitChange(val) {
    if (val === undefined || val === lastEmitted) return;
    lastEmitted = val;
    cb(val);
  }

  function goToIndex(idx, notify) {
    const clamped = Math.max(0, Math.min(vals.length - 1, idx));
    programmatic = true;
    el.scrollTop = scrollTopForIndex(clamped);
    const val = updateHighlight();
    requestAnimationFrame(() => { programmatic = false; });
    if (notify) emitChange(val);
    return clamped;
  }

  function snapTo(val) {
    lastEmitted = Number(val);
    goToIndex(indexForVal(val), false);
  }

  function applyDragDelta(dy) {
    const next = Math.max(0, Math.min(maxScrollTop(), el.scrollTop + dy * WHEEL_DRAG_RATIO));
    el.scrollTop = next;
    updateHighlight();
  }

  function endDrag() {
    if (!dragging) return;
    dragging = false;
    goToIndex(indexAtCenter(), true);
  }

  function onDragStart(clientY) {
    if (programmatic) return;
    dragging = true;
    dragLastY = clientY;
  }

  function onDragMove(clientY) {
    if (!dragging || programmatic) return;
    const dy = dragLastY - clientY;
    dragLastY = clientY;
    applyDragDelta(dy);
  }

  el.addEventListener('touchstart', e => {
    if (programmatic || e.touches.length !== 1) return;
    onDragStart(e.touches[0].clientY);
  }, { passive: true });

  el.addEventListener('touchmove', e => {
    if (!dragging || programmatic || e.touches.length !== 1) return;
    e.preventDefault();
    onDragMove(e.touches[0].clientY);
  }, { passive: false });

  el.addEventListener('touchend', () => { endDrag(); }, { passive: true });
  el.addEventListener('touchcancel', () => { endDrag(); }, { passive: true });

  el.addEventListener('pointerdown', e => {
    if (programmatic || e.button !== 0) return;
    onDragStart(e.clientY);
    try { el.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
  });

  el.addEventListener('pointermove', e => {
    if (!dragging || programmatic) return;
    e.preventDefault();
    onDragMove(e.clientY);
  });

  el.addEventListener('pointerup', () => { endDrag(); });
  el.addEventListener('pointercancel', () => { endDrag(); });

  el.addEventListener('wheel', e => {
    if (programmatic) return;
    e.preventDefault();
    applyDragDelta(e.deltaY * 0.12);
    goToIndex(indexAtCenter(), true);
  }, { passive: false });

  return { snapTo };
}

function mountDials() {
  const sp = minToParts(startMin);
  const ep = minToParts(endMin);
  wheelCtrls.whStart = fillWheel($('whStart'), HOURS, sp.h, h => {
    startMin = partsToMin(h, minToParts(startMin).m);
    render();
  });
  wheelCtrls.wmStart = fillWheel($('wmStart'), MINUTES, sp.m, m => {
    startMin = partsToMin(minToParts(startMin).h, m);
    render();
  });
  wheelCtrls.whEnd = fillWheel($('whEnd'), HOURS, ep.h, h => {
    endMin = partsToMin(h, minToParts(endMin).m);
    render();
  });
  wheelCtrls.wmEnd = fillWheel($('wmEnd'), MINUTES, ep.m, m => {
    endMin = partsToMin(minToParts(endMin).h, m);
    render();
  });
  wheelsMounted = true;
  requestAnimationFrame(() => {
    requestAnimationFrame(() => syncWheels());
  });
}

function syncWheels() {
  if (!wheelsMounted) return;
  const sp = minToParts(startMin);
  const ep = minToParts(endMin);
  wheelCtrls.whStart.snapTo(sp.h);
  wheelCtrls.wmStart.snapTo(sp.m);
  wheelCtrls.whEnd.snapTo(ep.h);
  wheelCtrls.wmEnd.snapTo(ep.m);
}

function hideDials() {
  dialsVisible = false;
  dialsLocked = true;
  applyDialLockUI();
}

function lockDials() {
  dialsLocked = true;
  dialsVisible = false;
  applyDialLockUI();
}

function toggleDialEdit() {
  if (status !== 'work') return;
  if (dialsLocked) {
    dialsVisible = true;
    dialsLocked = false;
    overtimePanelVisible = false;
    latePanelVisible = false;
    applyDialLockUI();
    if (!wheelsMounted) mountDials();
    else requestAnimationFrame(() => requestAnimationFrame(() => syncWheels()));
  } else {
    lockDials();
    const { ot, short } = calc();
    overtimePanelVisible = needsOvertimeReason(ot);
    if (!overtimePanelVisible) syncOvertimeReasonState(ot);
    latePanelVisible = needsLateReason(short);
    if (!latePanelVisible) syncLateReasonState(short);
    render();
  }
}

function applyDialLockUI() {
  const wrap = $('dialWrap');
  const btn = $('btnDialEdit');
  if (!wrap || !btn) return;
  const locked = status !== 'work' || dialsLocked;
  wrap.classList.toggle('dials-hidden', !dialsVisible || status !== 'work');
  wrap.classList.toggle('dials-locked', locked);
  wrap.classList.toggle('dials-editing', status === 'work' && dialsVisible && !dialsLocked);
  btn.textContent = (status === 'work' && dialsVisible && !dialsLocked) ? '確定' : '変更';
  btn.classList.toggle('editing', status === 'work' && dialsVisible && !dialsLocked);
  btn.disabled = status !== 'work';
}

/* ── UI構築 ── */
function buildToggles() {
  const container = $('shiftToggles');
  container.innerHTML = '';
  SHIFTS.forEach((shift, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'shift-toggle' + (i === selShiftIdx ? ' active' : '');
    btn.textContent = shift.label;
    btn.addEventListener('click', () => selShift(i));
    container.appendChild(btn);
  });
}

function selShift(i) {
  selShiftIdx = i;
  const shift = SHIFTS[i];
  startMin = shift.start;
  endMin = shift.end;
  breakMin = shift.breakMin;
  overtimePanelVisible = false;
  latePanelVisible = false;
  hideDials();
  buildToggles();
  render();
  mountDials();
}

function tog(key) {
  if (key === 'hol') holidayWorkFlag = !holidayWorkFlag;
  render();
}

function setMode(m) {
  status = m;
  if (m !== 'absence') { absenceReason = null; absenceNote = ''; }
  if (m !== 'work') {
    hideDials();
    overtimeReason = null;
    overtimeNote = '';
    overtimePanelVisible = false;
    lateKind = null;
    lateNote = '';
    latePanelVisible = false;
  }
  render();
}

function setOtReason(r) {
  overtimeReason = r;
  if (r !== 'other') overtimeNote = '';
  render();
}

function syncOvertimeReasonState(ot) {
  if (status !== 'work' || ot < OVERTIME_THRESHOLD_MIN) {
    overtimeReason = null;
    overtimeNote = '';
    overtimePanelVisible = false;
    if ($('overtimeNote')) $('overtimeNote').value = '';
  }
}

function shouldShowOvertimePanel(ot) {
  return overtimePanelVisible && needsOvertimeReason(ot) && dialsLocked && status === 'work';
}

function setLateKind(kind) {
  lateKind = kind;
  render();
}

function isTokuteiLateExempt() {
  const shift = SHIFTS[selShiftIdx];
  return !!(shift && shift.shiftKey === 'minami_kaigo_tokutei' && endMin >= 990);
}

function syncLateReasonState(short) {
  if (!needsLateReason(short)) {
    lateKind = null;
    lateNote = '';
    latePanelVisible = false;
    if ($('lateNote')) $('lateNote').value = '';
  }
}

function needsLateReason(short) {
  return status === 'work' && short && !isTokuteiLateExempt();
}

function shouldShowLatePanel(short) {
  return latePanelVisible && needsLateReason(short) && dialsLocked && status === 'work';
}

function needsOvertimeReason(ot) {
  return status === 'work' && ot >= OVERTIME_THRESHOLD_MIN;
}

function setAbs(r) {
  absenceReason = r;
  if (r !== 'other') absenceNote = '';
  render();
}

function calc() {
  const shift = SHIFTS[selShiftIdx];
  const shiftWorkMin = shift ? shift.workMin : 0;
  const work = computeActualWork(startMin, endMin, breakMin);
  const ot = computeOvertime(work, shiftWorkMin);
  const short = isShortWork(work, shiftWorkMin);
  return { work, ot, short, shiftWorkMin };
}

function getValidation() {
  const { short, ot } = calc();
  if (shouldShowLatePanel(short)) {
    if (!lateKind) {
      return { ok: false, msg: '遅刻または早退を選んでください。' };
    }
    if (isEmpty(lateNote)) {
      return { ok: false, msg: '遅刻・早退の理由を入力してください。' };
    }
  }
  if (shouldShowOvertimePanel(ot)) {
    if (!overtimeReason) {
      return { ok: false, msg: '残業が1時間以上です。残業理由を選んでください。' };
    }
    if (overtimeReason === 'other' && isEmpty(overtimeNote)) {
      return { ok: false, msg: '「その他」の残業理由を入力してください。' };
    }
  }
  if (status === 'absence' && !absenceReason) {
    return { ok: false, msg: '欠勤の理由（病欠／その他）を選んでください。' };
  }
  if (absenceReason === 'other' && isEmpty(absenceNote)) {
    return { ok: false, msg: '「その他」の欠勤理由を入力してください。' };
  }
  return { ok: true, msg: '' };
}

function render() {
  if (!staff) return;

  const shift = SHIFTS[selShiftIdx];
  const { work, ot, short } = calc();
  syncOvertimeReasonState(ot);
  syncLateReasonState(short);
  const val = getValidation();

  $('dialRange').textContent = `${fmtTime(startMin)} 〜 ${fmtTime(endMin)}`;

  const banner = $('banner');
  const bannerMain = $('bannerMain');
  const bannerSub = $('bannerSub');
  banner.className = 'banner';
  bannerSub.style.display = '';

  if (status === 'paid_leave') {
    const approval = displayApprovalStatus();
    if (approval === 'pending') {
      banner.classList.add('paid-pending');
      bannerMain.textContent = '有給申請中';
      bannerSub.textContent = '管理者の承認待ち';
      bannerSub.style.display = '';
    } else {
      banner.classList.add('paid');
      bannerMain.textContent = '有給';
      bannerSub.textContent = '承認済み';
      bannerSub.style.display = '';
    }
  } else if (status === 'absence') {
    banner.classList.add('abs');
    bannerMain.textContent = '欠勤';
    bannerSub.style.display = 'none';
  } else {
    banner.classList.add(holidayWorkFlag ? 'holiday' : 'work');
    bannerMain.textContent = `実働 ${fmtHours(work)}`;
    bannerSub.textContent = `残業 ${fmtHours(ot)}`;
  }

  $('workArea').classList.toggle('dimmed', status !== 'work');

  $('chipHol').classList.toggle('active', holidayWorkFlag);
  $('chipHol').classList.toggle('hol', holidayWorkFlag);

  const showLatePanel = shouldShowLatePanel(short);
  $('lateReasonPanel').style.display = showLatePanel ? 'block' : 'none';
  document.querySelectorAll('#lateKindRow .chip').forEach(btn => {
    const k = btn.dataset.kind;
    btn.classList.toggle('active', lateKind === k);
    btn.classList.toggle('late', lateKind === k);
  });
  $('lateNoteBlock').style.display = showLatePanel ? 'block' : 'none';

  const showOtPanel = shouldShowOvertimePanel(ot);
  $('overtimeReasonPanel').style.display = showOtPanel ? 'block' : 'none';
  document.querySelectorAll('#overtimeReasonRow .chip').forEach(btn => {
    const r = btn.dataset.reason;
    btn.classList.toggle('active', overtimeReason === r);
    btn.classList.toggle('ot', overtimeReason === r);
  });
  $('overtimeNoteBlock').style.display = showOtPanel && overtimeReason === 'other' ? 'block' : 'none';

  document.querySelectorAll('#segRow .seg').forEach(btn => {
    const m = btn.dataset.mode;
    btn.classList.toggle('active', status === m);
    btn.classList.toggle(m === 'work' ? 'work' : m === 'paid_leave' ? 'paid' : 'abs', status === m);
  });

  $('absReasonBlock').style.display = status === 'absence' ? 'block' : 'none';
  $('chipSick').classList.toggle('active', absenceReason === 'sick');
  $('chipSick').classList.toggle('sick', absenceReason === 'sick');
  $('chipOther').classList.toggle('active', absenceReason === 'other');
  $('chipOther').classList.toggle('other', absenceReason === 'other');
  $('absenceNote').style.display = absenceReason === 'other' ? 'block' : 'none';

  const approvalEl = $('approvalLabel');
  const approval = displayApprovalStatus();
  if (approval === 'pending') {
    approvalEl.style.display = 'inline-block';
    approvalEl.className = 'approval-label pending';
    approvalEl.textContent = '有給申請中';
  } else if (approval === 'approved') {
    approvalEl.style.display = 'inline-block';
    approvalEl.className = 'approval-label approved';
    approvalEl.textContent = '有給（承認済み）';
  } else {
    approvalEl.style.display = 'none';
    approvalEl.textContent = '';
  }

  const showWithdraw = isSavedPendingPaidLeave();
  $('btnWithdraw').style.display = showWithdraw ? 'block' : 'none';
  $('btnWithdraw').disabled = withdrawing || saving;
  $('btnWithdraw').textContent = withdrawing ? '取り下げ中…' : '申請を取り下げる';

  setWarnMsg(val.msg);
  $('btnSubmit').disabled = !val.ok || saving || withdrawing;
  $('btnSubmit').textContent = saving ? '送信中…' : '登録する';

  applyDialLockUI();
  saveDraft();
}

function applyRecord(rec) {
  if (!rec || rec.approvalStatus === 'withdrawn') {
    loadedRecord = null;
    resetForm();
    return;
  }
  loadedRecord = rec;
  status = rec.status || 'work';
  lateKind = rec.lateKind || (rec.lateFlag ? 'late' : null);
  lateNote = rec.lateNote || '';
  holidayWorkFlag = !!rec.holidayWorkFlag;
  absenceReason = rec.absenceReason || null;
  absenceNote = rec.absenceNote || '';
  overtimeReason = rec.overtimeReason || null;
  overtimeNote = rec.overtimeNote || '';
  memo = rec.memo || '';

  if (rec.shiftKey) {
    const idx = SHIFTS.findIndex(s => s.shiftKey === rec.shiftKey);
    if (idx >= 0) selShiftIdx = idx;
  }
  if (rec.start != null) startMin = Number(rec.start);
  if (rec.end != null) endMin = Number(rec.end);
  if (rec.breakMin != null) breakMin = Number(rec.breakMin);

  $('lateNote').value = lateNote;
  $('absenceNote').value = absenceNote;
  $('overtimeNote').value = overtimeNote;
  $('memo').value = memo;

  buildToggles();
  hideDials();
  if (status === 'work') {
    const shift = SHIFTS[selShiftIdx];
    const work = computeActualWork(startMin, endMin, breakMin);
    const ot = computeOvertime(work, shift ? shift.workMin : 0);
    const short = isShortWork(work, shift ? shift.workMin : 0);
    overtimePanelVisible = needsOvertimeReason(ot);
    latePanelVisible = needsLateReason(short);
  } else {
    overtimePanelVisible = false;
    latePanelVisible = false;
  }
  render();
  mountDials();
}

function applyDraft(d) {
  status = d.status || 'work';
  selShiftIdx = d.selShiftIdx != null ? d.selShiftIdx : selShiftIdx;
  startMin = d.startMin != null ? d.startMin : startMin;
  endMin = d.endMin != null ? d.endMin : endMin;
  breakMin = d.breakMin != null ? d.breakMin : breakMin;
  lateKind = d.lateKind || (d.lateFlag ? 'late' : null);
  lateNote = d.lateNote || '';
  holidayWorkFlag = !!d.holidayWorkFlag;
  absenceReason = d.absenceReason || null;
  absenceNote = d.absenceNote || '';
  overtimeReason = d.overtimeReason || null;
  overtimeNote = d.overtimeNote || '';
  memo = d.memo || '';
  $('lateNote').value = lateNote;
  $('absenceNote').value = absenceNote;
  $('overtimeNote').value = overtimeNote;
  $('memo').value = memo;
  buildToggles();
  hideDials();
  if (status === 'work') {
    const shift = SHIFTS[selShiftIdx];
    const work = computeActualWork(startMin, endMin, breakMin);
    const ot = computeOvertime(work, shift ? shift.workMin : 0);
    const short = isShortWork(work, shift ? shift.workMin : 0);
    overtimePanelVisible = needsOvertimeReason(ot) && !!overtimeReason;
    latePanelVisible = needsLateReason(short) && !!lateKind;
  } else {
    overtimePanelVisible = false;
    latePanelVisible = false;
  }
  render();
  mountDials();
}

function resetForm() {
  loadedRecord = null;
  status = 'work';
  lateKind = null;
  lateNote = '';
  holidayWorkFlag = false;
  absenceReason = null;
  absenceNote = '';
  overtimeReason = null;
  overtimeNote = '';
  overtimePanelVisible = false;
  latePanelVisible = false;
  memo = '';
  $('lateNote').value = '';
  $('absenceNote').value = '';
  $('overtimeNote').value = '';
  $('memo').value = '';

  if (!SHIFTS.length) return;

  const defKey = staff.defaultShiftKey;
  const idx = SHIFTS.findIndex(s => s.shiftKey === defKey);
  selShiftIdx = idx >= 0 ? idx : 0;
  const shift = SHIFTS[selShiftIdx];
  startMin = shift.start;
  endMin = shift.end;
  breakMin = shift.breakMin;

  buildToggles();
  render();
  mountDials();
  hideDials();
}

function buildRecord() {
  const shift = SHIFTS[selShiftIdx];
  const { work, ot } = calc();
  const now = new Date().toISOString();

  return {
    date: currentDate,
    staffId: staff.staffId,
    status,
    shiftKey: status === 'work' ? shift.shiftKey : (loadedRecord && loadedRecord.shiftKey) || shift.shiftKey,
    start: startMin,
    end: endMin,
    breakMin,
    workMin: status === 'work' ? work : 0,
    overtimeMin: status === 'work' ? ot : 0,
    lateFlag: !!lateKind,
    lateKind: lateKind || null,
    lateNote: lateKind ? lateNote.trim() : '',
    holidayWorkFlag,
    absenceReason: status === 'absence' ? absenceReason : null,
    absenceNote: absenceNote.trim(),
    overtimeReason: shouldShowOvertimePanel(ot) ? overtimeReason : null,
    overtimeNote: shouldShowOvertimePanel(ot) && overtimeReason === 'other' ? overtimeNote.trim() : '',
    memo: memo.trim(),
    approvalStatus: computeApprovalStatus(currentDate, status, loadedRecord),
    createdBy: staff.staffId,
    createdAt: (loadedRecord && loadedRecord.createdAt) || now,
    updatedAt: now
  };
}

/* ── localStorage（下書き・キャッシュ） ── */
function draftKey() {
  return `kinmu_draft_${staff.staffId}_${currentDate}`;
}

function saveDraft() {
  if (!staff) return;
  lateNote = $('lateNote').value;
  absenceNote = $('absenceNote').value;
  overtimeNote = $('overtimeNote').value;
  memo = $('memo').value;
  try {
    localStorage.setItem(draftKey(), JSON.stringify({
      status, selShiftIdx, startMin, endMin, breakMin,
      lateKind, lateNote, holidayWorkFlag,
      absenceReason, absenceNote, overtimeReason, overtimeNote, memo
    }));
  } catch (_) { /* ignore */ }
}

function loadDraftRecord(date) {
  const d = date || currentDate;
  try {
    const raw = localStorage.getItem(`kinmu_record_${recordKey(d, staff.staffId)}`);
    return raw ? JSON.parse(raw) : null;
  } catch (_) { return null; }
}

function cacheRecord(rec) {
  try {
    localStorage.setItem(`kinmu_record_${recordKey(rec.date, rec.staffId)}`, JSON.stringify(rec));
  } catch (_) { /* ignore */ }
}

/* ── GAS 同期 ── */
async function fetchStaffFromGas(staffId) {
  if (!gasConfigured()) return null;
  try {
    const url = `${GAS_URL}?type=staff`;
    const res = await fetch(url);
    if (!res.ok) return null;
    const data = await res.json();
    if (!data.ok) return null;
    const staffMap = data.staff || {};
    return staffMap[staffId] || null;
  } catch (_) {
    return null;
  }
}

async function fetchRecordFromGas(date, staffId) {
  if (!gasConfigured()) return null;
  try {
    const url = `${GAS_URL}?type=record&date=${encodeURIComponent(date)}&staffId=${encodeURIComponent(staffId)}`;
    const res = await fetch(url);
    if (!res.ok) return null;
    const data = await res.json();
    if (!data.ok) return null;
    return data.record || null;
  } catch (_) {
    return null;
  }
}

async function fetchRecordsByStaff(staffId, from, to) {
  if (!gasConfigured()) {
    return { ok: false, error: '履歴を取得できませんでした。通信状況を確認してください。' };
  }
  try {
    const url = `${GAS_URL}?type=recordsByStaff&staffId=${encodeURIComponent(staffId)}&from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`;
    const res = await fetch(url);
    if (!res.ok) return { ok: false, error: '履歴を取得できませんでした。通信状況を確認してください。' };
    const data = await res.json();
    if (!data.ok) return { ok: false, error: data.error || '履歴を取得できませんでした。通信状況を確認してください。' };
    return { ok: true, records: data.records || [] };
  } catch (_) {
    return { ok: false, error: '履歴を取得できませんでした。通信状況を確認してください。' };
  }
}

async function withdrawRecordToGas(date, staffId) {
  const errMsg = '取り下げできませんでした。通信状況を確認してもう一度お試しください';
  if (!gasConfigured()) {
    return { ok: false, error: errMsg };
  }
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 30000);
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'withdraw', date, staffId }),
      signal: controller.signal
    });
    clearTimeout(timer);
    let data;
    try {
      data = await res.json();
    } catch (_) {
      return { ok: false, error: errMsg };
    }
    if (data.ok) return { ok: true };
    return { ok: false, error: data.error || errMsg };
  } catch (_) {
    clearTimeout(timer);
    return { ok: false, error: errMsg };
  }
}

async function saveRecordToGas(record) {
  const errMsg = '保存できませんでした。通信状況を確認してもう一度お試しください';
  if (!gasConfigured()) {
    return { ok: false, error: errMsg };
  }
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 30000);
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(record),
      signal: controller.signal
    });
    clearTimeout(timer);
    let data;
    try {
      data = await res.json();
    } catch (_) {
      return { ok: false, error: errMsg };
    }
    if (data.ok) {
      const saved = mergeSavedRecord(record, data.record || record);
      cacheRecord(saved);
      return { ok: true, record: saved };
    }
    return { ok: false, error: data.error || errMsg };
  } catch (e) {
    clearTimeout(timer);
    return { ok: false, error: errMsg };
  }
}

async function loadRecordForDate(date) {
  if (gasConfigured()) {
    const rec = await fetchRecordFromGas(date, staff.staffId);
    if (rec) {
      cacheRecord(rec);
      applyRecord(rec);
      return;
    }
    resetForm();
    return;
  }

  const cached = loadDraftRecord(date);
  if (cached) {
    applyRecord(cached);
    return;
  }
  try {
    const draftRaw = localStorage.getItem(`kinmu_draft_${staff.staffId}_${date}`);
    if (draftRaw) {
      applyDraft(JSON.parse(draftRaw));
      return;
    }
  } catch (_) { /* ignore */ }
  resetForm();
}

async function submitRecord() {
  lateNote = $('lateNote').value;
  absenceNote = $('absenceNote').value;
  overtimeNote = $('overtimeNote').value;
  memo = $('memo').value;

  const val = getValidation();
  if (!val.ok || saving) return;

  saving = true;
  setWarnMsg('');
  render();

  const record = buildRecord();
  const result = await saveRecordToGas(record);

  saving = false;
  if (result.ok) {
    try { localStorage.removeItem(draftKey()); } catch (_) { /* ignore */ }
    const saved = result.record || record;
    applyRecord(saved);
    showBriefToast(saveSuccessMessage(saved), saveSuccessKind(saved));
    setWarnMsg('');
  } else {
    saveDraft();
    setWarnMsg(result.error || '保存できませんでした。通信状況を確認してもう一度お試しください');
  }
  render();
}

async function withdrawPaidLeave() {
  if (!isSavedPendingPaidLeave() || withdrawing || saving) return;
  if (!confirm('有給申請を取り下げますか？')) return;

  withdrawing = true;
  setWarnMsg('');
  render();

  const result = await withdrawRecordToGas(currentDate, staff.staffId);
  withdrawing = false;

  if (result.ok) {
    try { localStorage.removeItem(draftKey()); } catch (_) { /* ignore */ }
    try {
      localStorage.removeItem(`kinmu_record_${recordKey(currentDate, staff.staffId)}`);
    } catch (_) { /* ignore */ }
    resetForm();
    showBriefToast('申請を取り下げました');
    setWarnMsg('');
  } else {
    setWarnMsg(result.error || '取り下げできませんでした。もう一度お試しください');
  }
  render();
}

/* ── 履歴 ── */
function openHistory() {
  if (!staff) return;
  histPeriodOffset = 0;
  $('historyView').style.display = 'block';
  $('historyView').setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  loadHistory();
}

function closeHistory() {
  $('historyView').style.display = 'none';
  $('historyView').setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}

function updateHistPeriodNav() {
  $('histPrevPeriod').disabled = histPeriodOffset >= 1;
  $('histNextPeriod').disabled = histPeriodOffset <= 0;
}

function renderHistorySummary(records) {
  const visible = records.filter(r => r.approvalStatus !== 'withdrawn');
  const workRecs = visible.filter(r => r.status === 'work');
  const paidCount = visible.filter(r => r.status === 'paid_leave').length;
  const workDays = workRecs.length;
  const totalWork = workRecs.reduce((s, r) => s + (Number(r.workMin) || 0), 0);
  const totalOt = workRecs.reduce((s, r) => s + (Number(r.overtimeMin) || 0), 0);
  const el = $('histSummary');
  el.style.display = 'grid';
  el.innerHTML = `

function renderHistoryList(records) {
  const list = $('histList');
  list.innerHTML = '';
  const sorted = records
    .filter(r => r.approvalStatus !== 'withdrawn')
    .slice()
    .sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  sorted.forEach(rec => {
    const row = document.createElement('div');
    row.className = `hist-row ${historyRowClass(rec)}`;
    row.innerHTML = buildHistoryRowHtml(rec);
    list.appendChild(row);
  });
}

function renderHistoryError(msg) {
  $('histSummary').style.display = 'none';
  $('histList').innerHTML = '';
  const st = $('histStatus');
  st.className = 'hist-status error';
  st.innerHTML = `${msg}<br><button type="button" class="hist-retry" id="histRetry">再試行</button>`;
  $('histRetry').addEventListener('click', loadHistory);
}

async function loadHistory() {
  if (!staff || histLoading) return;
  histLoading = true;
  const period = getPeriodByOffset(histPeriodOffset);
  $('histPeriodLabel').innerHTML = `${period.label}<br><span style="font-size:.75rem;font-weight:500;color:#6b6562">（${period.rangeLabel}）</span>`;
  updateHistPeriodNav();
  $('histSummary').style.display = 'none';
  $('histList').innerHTML = '';
  $('histStatus').style.display = 'block';
  $('histStatus').className = 'hist-status';
  $('histStatus').textContent = '読み込み中…';

  const result = await fetchRecordsByStaff(staff.staffId, period.from, period.to);
  histLoading = false;

  if (!result.ok) {
    renderHistoryError(result.error);
    return;
  }

  const records = result.records;
  $('histStatus').textContent = '';
  $('histStatus').style.display = 'none';

  if (!records.length) {
    $('histStatus').style.display = 'block';
    $('histStatus').textContent = '記録がありません';
    return;
  }

  renderHistorySummary(records);
  renderHistoryList(records);
}

function initHistory() {
  $('btnHistory').addEventListener('click', openHistory);
  $('histBack').addEventListener('click', closeHistory);
  $('histPrevPeriod').addEventListener('click', () => {
    if (histPeriodOffset >= 1) return;
    histPeriodOffset++;
    loadHistory();
  });
  $('histNextPeriod').addEventListener('click', () => {
    if (histPeriodOffset <= 0) return;
    histPeriodOffset--;
    loadHistory();
  });
}

function updateDateNav() {
  $('dateLabel').textContent = fmtReiwa(currentDate);
}

async function jumpToDate(dateStr) {
  saveDraft();
  currentDate = dateStr;
  updateDateNav();
  await loadRecordForDate(currentDate);
}

async function changeDate(delta) {
  await jumpToDate(addDays(currentDate, delta));
}

function openCalendar() {
  const [y, m] = currentDate.split('-').map(Number);
  calViewYear = y;
  calViewMonth = m;
  renderCalendar();
  $('calOverlay').style.display = 'flex';
  $('calOverlay').setAttribute('aria-hidden', 'false');
}

function closeCalendar() {
  $('calOverlay').style.display = 'none';
  $('calOverlay').setAttribute('aria-hidden', 'true');
}

function calNavMonth(delta) {
  calViewMonth += delta;
  if (calViewMonth > 12) { calViewMonth = 1; calViewYear++; }
  if (calViewMonth < 1) { calViewMonth = 12; calViewYear--; }
  renderCalendar();
}

function renderCalendar() {
  $('calTitle').textContent = `${calViewYear}年${calViewMonth}月`;
  const grid = $('calGrid');
  grid.innerHTML = '';
  const today = todayStr();

  const startDow = new Date(calViewYear, calViewMonth - 1, 1).getDay();
  const daysInMonth = new Date(calViewYear, calViewMonth, 0).getDate();

  for (let i = 0; i < startDow; i++) {
    const empty = document.createElement('div');
    empty.className = 'cal-day cal-empty';
    grid.appendChild(empty);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calViewYear}-${String(calViewMonth).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'cal-day';
    btn.textContent = d;
    if (dateStr === currentDate) btn.classList.add('selected');
    if (dateStr === today) btn.classList.add('today');
    btn.addEventListener('click', () => {
      closeCalendar();
      if (dateStr !== currentDate) jumpToDate(dateStr);
    });
    grid.appendChild(btn);
  }
}

function initCalendar() {
  $('dateLabel').addEventListener('click', openCalendar);
  $('calClose').addEventListener('click', closeCalendar);
  $('calPrevMonth').addEventListener('click', () => calNavMonth(-1));
  $('calNextMonth').addEventListener('click', () => calNavMonth(1));
  $('calOverlay').addEventListener('click', e => {
    if (e.target === $('calOverlay')) closeCalendar();
  });
}

function showNotRegistered(profile) {
  $('app').style.display = 'none';
  $('notReg').style.display = 'flex';

  const userId = (profile && profile.userId) ? profile.userId : '';
  const displayName = (profile && profile.displayName) ? profile.displayName : '';

  const idEl = $('notRegId');
  idEl.value = userId;
  idEl.onclick = function () { this.focus(); this.select(); };

  $('notRegName').textContent = displayName || '—';

  // 本部に送る／コピーする本文（氏名＋userId）
  const msgText = '【出勤簿 ID登録】\n氏名：' + (displayName || '(未取得)') +
                  '\nuserId：' + (userId || '(未取得)');

  const statusEl = $('notRegStatus');
  function setStatus(text, isErr) {
    statusEl.textContent = text;
    statusEl.className = 'not-reg-status' + (isErr ? ' err' : '');
  }

  // クリップボードへコピー（新API→失敗時は旧方式）
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.focus(); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        resolve();
      } catch (e) { reject(e); }
    });
  }

  // 「本部にIDを送る」：sendMessage を試し、ダメならコピーにフォールバック
  $('notRegSend').onclick = function () {
    const canSend = (typeof woff !== 'undefined') && woff.isInClient &&
                    woff.isInClient() && woff.sendMessage;
    if (canSend) {
      woff.sendMessage({ content: msgText }).then(function () {
        setStatus('✓ 送信しました。本部の登録をお待ちください。', false);
      }).catch(function () {
        copyText(msgText).then(function () {
          setStatus('自動送信できなかったため、コピーしました。本部のトークに貼り付けて送ってください。', true);
        }).catch(function () {
          setStatus('送信もコピーもできませんでした。上のIDを本部にお伝えください。', true);
        });
      });
    } else {
      copyText(msgText).then(function () {
        setStatus('コピーしました。本部のトークに貼り付けて送ってください。', true);
      }).catch(function () {
        setStatus('コピーできませんでした。上のIDを本部にお伝えください。', true);
      });
    }
  };

  // 「IDをコピー」
  $('notRegCopy').onclick = function () {
    copyText(msgText).then(function () {
      setStatus('コピーしました。本部のトークに貼り付けて送ってください。', false);
    }).catch(function () {
      setStatus('コピーできませんでした。上のIDを本部にお伝えください。', true);
    });
  };
}

  staff = staffDef;

  const job = JOB_LABELS[staff.jobType] || staff.jobType;

  $('app').style.display = 'block';
  currentDate = todayStr();
  updateDateNav();

  if (SHIFTS.length) {
    const defKey = staff.defaultShiftKey;
    const idx = SHIFTS.findIndex(s => s.shiftKey === defKey);
    selShiftIdx = idx >= 0 ? idx : 0;
    const shift = SHIFTS[selShiftIdx];
    startMin = shift.start;
    endMin = shift.end;

  buildToggles();

    const btn = e.target.closest('[data-reason]');

  document.querySelectorAll('#segRow .seg').forEach(btn => {

  $('memo').addEventListener('input', () => { memo = $('memo').value; render(); });
  $('btnSubmit').addEventListener('click', submitRecord);
  $('btnWithdraw').addEventListener('click', withdrawPaidLeave);
  $('btnDialEdit').addEventListener('click', toggleDialEdit);

}

let guideCurrentPage = 0;

function openGuide() {
  guideCurrentPage = 0;
  renderGuidePage();
  const modal = document.getElementById('guideModal');
  modal.style.display = 'flex';
  // スクロールをトップに
  document.getElementById('guideContent').scrollTop = 0;
}

function closeGuide() {
  document.getElementById('guideModal').style.display = 'none';
}

function renderGuidePage() {
  document.getElementById('guideContent').innerHTML = GUIDE_PAGES[guideCurrentPage];
  document.getElementById('guideContent').scrollTop = 0;
  document.getElementById('guidePageLabel').textContent =
    (guideCurrentPage + 1) + ' / ' + GUIDE_PAGES.length;
  // 前へ/次へボタンの表示制御
  const prevBtn = document.querySelector('#guideModal button[onclick="guidePrev()"]');
  const nextBtn = document.querySelector('#guideModal button[onclick="guideNext()"]');
  if (prevBtn) prevBtn.style.visibility = guideCurrentPage === 0 ? 'hidden' : 'visible';
  if (nextBtn) nextBtn.textContent = guideCurrentPage === GUIDE_PAGES.length - 1 ? '閉じる ✕' : '次へ ▶';
}

function guidePrev() {
  if (guideCurrentPage > 0) {
    guideCurrentPage--;
    renderGuidePage();
  }
}

function guideNext() {
  if (guideCurrentPage < GUIDE_PAGES.length - 1) {
    guideCurrentPage++;
    renderGuidePage();
  } else {
    closeGuide();
  }
}

async function getWoffProfile() {
  try {
    return await woff.getProfile();
  } catch (e) {
    if (typeof woff.login === 'function') {
      await woff.login();
      return null;
    }
    throw e;
  }
}

window.addEventListener('load', async () => {
  if (typeof woff === 'undefined') {
    bootApp(staffMaster['dev-staff-001']);
    return;
  }

  try {
    await woff.init({ woffId: WOFF_ID });
    const profile = await getWoffProfile();
    if (!profile) return;

    const userId = profile.userId;
    // ※本番前に削除可
    console.log('WOFF userId:', userId);

    const s = await fetchStaffFromGas(userId);
    if (!s || s.active === false) {
      showNotRegistered(profile);
      return;
    }

    const staffData = {
      ...s,
      name: (staffMaster[userId] && staffMaster[userId].name) || s.name
    };
    bootApp(staffData, profile.displayName);
  } catch (e) {
    console.error('WOFF init failed:', e);
    showNotRegistered({ userId: '' });
  }
});
</script>
